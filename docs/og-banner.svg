<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">MOONSHIPS — Your Infrastructure. Your Rules.</title>
<desc id="desc">Space punk brand artwork: crescent moon, orbital paths, underground print texture, and the message No Permission Needed.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B10"/><stop offset=".58" stop-color="#151922"/><stop offset="1" stop-color="#24203B"/></linearGradient>
  <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F1E8"/><stop offset=".55" stop-color="#69D8F2"/><stop offset="1" stop-color="#9B8CFF"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#9299A6" stroke-opacity=".12" stroke-width="1"/></pattern>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
<g fill="#F4F1E8" opacity=".75"><circle cx="92" cy="90" r="2"/><circle cx="1070" cy="105" r="2"/><circle cx="1020" cy="530" r="2.5"/><circle cx="260" cy="510" r="1.8"/><circle cx="1150" cy="310" r="1.5"/><circle cx="420" cy="70" r="1.5"/><circle cx="720" cy="555" r="1.4"/></g>
<g transform="translate(105 135)"><circle cx="165" cy="165" r="128" fill="none" stroke="#9299A6" stroke-opacity=".55" stroke-width="2"/><ellipse cx="165" cy="165" rx="157" ry="63" fill="none" stroke="#69D8F2" stroke-width="4" transform="rotate(-28 165 165)"/><ellipse cx="165" cy="165" rx="185" ry="82" fill="none" stroke="#9B8CFF" stroke-opacity=".65" stroke-width="1.5" transform="rotate(24 165 165)"/><path d="M193 55a119 119 0 1 0 68 207A99 99 0 0 1 193 55Z" fill="url(#moon)"/><circle cx="286" cy="88" r="9" fill="#C7F464"/><circle cx="58" cy="268" r="5" fill="#FF6B4A"/></g>
<g transform="rotate(-3 790 280)"><text x="490" y="260" fill="#FFFDF7" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="900" letter-spacing="3">MOONSHIPS</text><rect x="495" y="285" width="540" height="5" fill="#C7F464"/><text x="495" y="345" fill="#C7F464" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" letter-spacing="5">NO PERMISSION NEEDED.</text><text x="498" y="405" fill="#F4F1E8" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="2">YOUR INFRASTRUCTURE. YOUR RULES.</text><text x="500" y="455" fill="#9299A6" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="2">OPEN-SOURCE • SELF-HOSTED • UNDER YOUR CONTROL</text></g>
<g transform="translate(930 68) rotate(8)"><rect width="190" height="42" rx="2" fill="#C7F464"/><text x="95" y="27" text-anchor="middle" fill="#090B10" font-family="monospace" font-size="14" font-weight="800" letter-spacing="2">BUILD YOUR ORBIT</text></g>
<rect width="1200" height="630" filter="url(#grain)" opacity=".34"/><path d="M0 600H1200" stroke="#C7F464" stroke-width="3" opacity=".8"/>
</svg>