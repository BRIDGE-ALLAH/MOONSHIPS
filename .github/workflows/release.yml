name: Build & Release

# A release is permitted only after the CI workflow has completed successfully
# for a push to main. All build inputs are pinned to that workflow_run.head_sha.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    name: Build verified commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact CI-verified SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify checked-out source SHA
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/release_gate.py "$GITHUB_EVENT_PATH" "$GITHUB_REPOSITORY"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Prepare checksummed artifacts
        run: |
          set -euo pipefail
          for bin in pier pier-agent pier-net-helper; do
            test -x "target/release/$bin"
            install -m 0755 "target/release/$bin" "$bin-linux-amd64"
            sha256sum "$bin-linux-amd64" > "$bin-linux-amd64.sha256"
          done
          sha256sum pier-linux-amd64 pier-agent-linux-amd64 pier-net-helper-linux-amd64 > SHA256SUMS

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ github.event.workflow_run.head_sha }}
          path: |
            pier-linux-amd64
            pier-linux-amd64.sha256
            pier-agent-linux-amd64
            pier-agent-linux-amd64.sha256
            pier-net-helper-linux-amd64
            pier-net-helper-linux-amd64.sha256
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact CI-verified source for release metadata
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify checked-out source SHA
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Download artifacts from this release run
        uses: actions/download-artifact@v4
        with:
          name: release-binaries-${{ github.event.workflow_run.head_sha }}
          path: dist

      - name: Verify artifact checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for file in pier-linux-amd64 pier-agent-linux-amd64 pier-net-helper-linux-amd64; do
            sha256sum --check "$file.sha256"
          done

      - name: Move rolling latest tag to the CI-verified commit
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git push --force origin "$SOURCE_SHA:refs/tags/latest"

      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: |
            Automated build from `main`.
            Source SHA: ${{ github.event.workflow_run.head_sha }}
            CI run: ${{ github.event.workflow_run.html_url }}
            Built by a release workflow gated on successful CI for the exact source SHA.
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          prerelease: true
          files: |
            dist/pier-linux-amd64
            dist/pier-linux-amd64.sha256
            dist/pier-agent-linux-amd64
            dist/pier-agent-linux-amd64.sha256
            dist/pier-net-helper-linux-amd64
            dist/pier-net-helper-linux-amd64.sha256
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine whether a versioned release is new
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish versioned release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          prerelease: false
          files: |
            dist/pier-linux-amd64
            dist/pier-linux-amd64.sha256
            dist/pier-agent-linux-amd64
            dist/pier-agent-linux-amd64.sha256
            dist/pier-net-helper-linux-amd64
            dist/pier-net-helper-linux-amd64.sha256
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
