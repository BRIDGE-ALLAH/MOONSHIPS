<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MOONSHIPS — No Permission Needed</title><desc id="desc">Wide Space Punk campaign banner with orbital rings, lunar form, and product descriptor.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090B10"/><stop offset="1" stop-color="#151922"/></linearGradient><radialGradient id="moon"><stop stop-color="#FFFDF7"/><stop offset="1" stop-color="#9299A6"/></radialGradient><pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="12" cy="18" r="1" fill="#FFFDF7" opacity=".16"/><circle cx="57" cy="61" r="1" fill="#FFFDF7" opacity=".1"/></pattern></defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grain)"/>
<g fill="none" stroke="#9B8CFF" opacity=".85"><ellipse cx="1210" cy="410" rx="490" ry="180" transform="rotate(-24 1210 410)" stroke-width="7"/><ellipse cx="1210" cy="410" rx="560" ry="230" transform="rotate(-24 1210 410)" stroke-width="2"/></g>
<circle cx="1210" cy="390" r="245" fill="url(#moon)"/><g fill="#151922" opacity=".18"><circle cx="1120" cy="300" r="48"/><circle cx="1290" cy="460" r="64"/><circle cx="1180" cy="520" r="25"/></g>
<text x="90" y="110" fill="#FFFDF7" font-family="Arial,sans-serif" font-size="48" font-weight="900">◉ MOONSHIPS</text>
<text x="90" y="250" fill="#C7F464" font-family="monospace" font-size="26" letter-spacing="8">OPEN SOURCE / SELF-HOSTED</text>
<text x="84" y="430" fill="#FFFDF7" font-family="Arial Black,Arial,sans-serif" font-size="142" font-weight="900">NO</text>
<text x="84" y="570" fill="#C7F464" font-family="Arial Black,Arial,sans-serif" font-size="142" font-weight="900">PERMISSION</text>
<text x="84" y="710" fill="#C7F464" font-family="Arial Black,Arial,sans-serif" font-size="142" font-weight="900">NEEDED.</text>
<text x="92" y="790" fill="#FFFDF7" font-family="Arial,sans-serif" font-size="34">YOUR INFRASTRUCTURE. YOUR RULES.</text>
<text x="92" y="845" fill="#9299A6" font-family="monospace" font-size="22">A SELF-HOSTED CONTROL PLANE FOR YOUR STACK.</text>
</svg>